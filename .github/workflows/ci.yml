name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Startup/import smoke test
        run: python -c "import SpectraScan; from modules.async_scanner import AsyncPortScanner; from modules.vuln_scanner import VulnScanner"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - name: Static security analysis
        run: |
          python -m pip install bandit
          python -m bandit -q -r SpectraScan.py modules -x modules/darkweb.py
